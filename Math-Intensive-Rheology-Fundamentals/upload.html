<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07060f" />
    <title>Derivation Workbench</title>
    <!-- PWA: installable on Android/iOS via "Add to Home Screen" -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workbench" />
    <script>
      if ("serviceWorker" in navigator && window.isSecureContext) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=obsidian-1" />
    <script>
      window.MathJax = {
        tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]], displayMath: [["\\[", "\\]"], ["$$", "$$"]] },
        svg: { fontCache: "global" }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script defer src="upload.js?v=obsidian-1"></script>
  </head>
  <body>
    <main class="wb-shell">
      <aside class="wb-side">
        <div class="wb-brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <path d="M13 39c14-1 14-22 23-22 7 0 5 12 1 18 8-4 15-3 15 4 0 8-12 8-19 3-6 8-16 8-20-3Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M48 11v10M43 16h10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>
          <div><h1>Derivation Workbench</h1><p>Your scanned papers &amp; their mathematics</p></div>
          <button class="side-toggle" id="sideToggle" title="Hide panel" aria-label="Hide panel">«</button>
        </div>

        <label class="dz-compact" id="dropzone" for="pdfInput">
          <input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden />
          <span class="dz-plus">＋</span> Add a PDF
        </label>
        <div id="upStatus" class="up-status"></div>

        <button class="graph-cta" id="graphBtn">⊛ Knowledge graph (across PDFs)</button>
        <button class="cache-reset" id="cacheReset" title="Reload fresh app files if the interface looks stale">↻ refresh app</button>

        <div class="lib-head">Scanned PDFs</div>
        <div id="libList" class="lib-list"></div>
      </aside>

      <button class="side-reopen" id="sideReopen" title="Show panel" aria-label="Show panel">»</button>

      <section class="wb-main">
        <section class="up-result" id="upResult">
          <div class="detail-empty">Add a PDF, or pick one from the left to review its mathematics. Use <b>Knowledge graph</b> to compare the maths across your papers.</div>
        </section>
        <section class="graph-view" id="graphView" hidden></section>
      </section>
    </main>
  </body>
</html>
